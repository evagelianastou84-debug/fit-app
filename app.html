const LangContext = React.createContext("en");

function makeT(lang) {
  return function (key, vars) {
    const dict = I18N[lang] || I18N.en;
    let s = dict[key] !== undefined ? dict[key] : (I18N.en[key] !== undefined ? I18N.en[key] : key);
    if (vars) {
      for (const k in vars) s = s.split("{" + k + "}").join(String(vars[k]));
    }
    return s;
  };
}

function useT() {
  return makeT(React.useContext(LangContext));
}

function detectLang() {
  try {
    const stored = localStorage.getItem("fit_lang");
    if (stored && I18N[stored]) return stored;
  } catch (e) {}
  const nav = ((navigator.language || "en") + "").slice(0, 2).toLowerCase();
  return I18N[nav] ? nav : "en";
}

function outfitLabel(t, label) {
  const k = "lbl_" + String(label || "").toLowerCase();
  const v = t(k);
  return v === k ? label : v;
}

function catName(t, cat) {
  const k = "cat_" + cat;
  const v = t(k);
  return v === k ? cat : v;
}

function dataUrlToBlob(u) {
  const parts = u.split(",");
  const mime = (parts[0].match(/:(.*?);/) || [null, "image/jpeg"])[1];
  const bin = atob(parts[1]);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function blobToDataUrl(b) {
  return new Promise(function (resolve, reject) {
    const r = new FileReader();
    r.onload = function () { resolve(r.result); };
    r.onerror = reject;
    r.readAsDataURL(b);
  });
}

/* Shrinks big phone photos (keeps orientation) so they save, upload and
   analyze faster. Falls back to the original file if anything fails. */
function resizePhoto(file, maxSide) {
  return new Promise(function (resolve) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () {
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, maxSide / Math.max(w, h));
      w = Math.round(w * scale);
      h = Math.round(h * scale);
      try {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { resolve(b || file); }, "image/jpeg", 0.92);
      } catch (e) {
        URL.revokeObjectURL(url);
        resolve(file);
      }
    };
    img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

function getDeviceId() {
  let id = localStorage.getItem("fit_device_id");
  if (!id) {
    id = "device_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem("fit_device_id", id);
  }
  return id;
}

async function saveFavorite(outfit) {
  const res = await fetch(CATALOG_URL + "/favorites", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      device_id: getDeviceId(),
      outfit_label: outfit.label,
      items: outfit.items,
      price_total: outfit.priceTotal,
    }),
  });
  if (!res.ok) throw new Error("Could not save favorite (" + res.status + ")");
  return res.json();
}

async function fetchFavorites() {
  const res = await fetch(CATALOG_URL + "/favorites?device_id=" + encodeURIComponent(getDeviceId()));
  if (!res.ok) throw new Error("Could not load favorites (" + res.status + ")");
  return res.json();
}

async function deleteFavoriteById(id) {
  const res = await fetch(CATALOG_URL + "/favorites/" + id, { method: "DELETE" });
  if (!res.ok) throw new Error("Could not delete favorite (" + res.status + ")");
  return res.json();
}

/* Calls the self-hosted FASHN VTON API with the user's photo, chaining
   through every garment in `items` that has an image_url and is a
   category the model supports (top/bottom/dress) — the result of each
   step becomes the "person" photo for the next, so several garments
   end up layered in one final image. Shoes and other categories are
   not supported by the model and are skipped here; they still show
   as text in the outfit list. */
const TRYON_CATEGORY_MAP = { top: "tops", bottom: "bottoms", dress: "one-pieces" };
const TRYON_CATEGORY_ORDER = ["dress", "top", "bottom"];

function TryOnPreview(props) {
  const photo = props.photo;
  const items = props.items;
  const t = useT();

  const [resultUrl, setResultUrl] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    if (!photo || !items || items.length === 0) return;

    const chainItems = items
      .filter(function (i) { return i.image_url && TRYON_CATEGORY_MAP[i.category]; })
      .sort(function (a, b) { return TRYON_CATEGORY_ORDER.indexOf(a.category) - TRYON_CATEGORY_ORDER.indexOf(b.category); });

    if (chainItems.length === 0) return;

    let cancelled = false;
    setLoading(true);
    setError(null);
    setResultUrl(null);

    async function runChain() {
      let personBlob = photo;
      for (const item of chainItems) {
        const form = new FormData();
        form.append("person", personBlob, "person.png");
        form.append("garment_url", item.image_url);
        form.append("category", TRYON_CATEGORY_MAP[item.category]);
        const res = await fetch(`${TRYON_URL}/tryon`, { method: "POST", body: form });
        if (!res.ok) throw new Error(t("tryon_failed", { name: item.name }));
        personBlob = await res.blob();
      }
      return personBlob;
    }

    runChain()
      .then(function (blob) {
        if (!cancelled) setResultUrl(URL.createObjectURL(blob));
      })
      .catch(function (err) {
        if (!cancelled) setError(err.message);
      })
      .finally(function () {
        if (!cancelled) setLoading(false);
      });

    return function () { cancelled = true; };
  }, [photo, items]);

  if (!photo) {

  if (loading) {

  }

  if (resultUrl) {
    return React.createElement("img", { src: resultUrl, alt: "Try-on result", style: { width: "100%", height: "100%", objectFit: "contain", display: "block" } });
  }

  if (error) {
    return React.createElement("div", { style: { width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", background: "#2A1515", color: "#E8A8A0", fontSize: 10, padding: 4, textAlign: "center", overflow: "hidden" } }, error);

async function callFitService(photoFile, heightCm) {
  const form = new FormData();
  form.append("photo", photoFile, "photo.jpg");
  form.append("height_cm", String(heightCm));
  const res = await fetch(FIT_URL + "/analyze-photo", { method: "POST", body: form });
  if (!res.ok) throw new Error("Fit Service error (" + res.status + ")");
  return res.json();
}

async function fetchCatalogProducts(occasion, season, category) {
  const params = new URLSearchParams();
  if (occasion) params.set("occasion", occasion.toLowerCase());
  if (season) params.set("season", season.toLowerCase());
  if (category) params.set("category", category);
  const res = await fetch(CATALOG_URL + "/products?" + params.toString());
  if (!res.ok) throw new Error("Catalog Service error (" + res.status + ")");
  return res.json();
}

async function fetchStyledOutfits(bodyType, occasion, season, budgetEur) {
  const res = await fetch(STYLING_URL + "/recommend-outfits", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ body_type: bodyType, occasion: occasion, season: season, budget_eur: budgetEur }),
  });
  if (!res.ok) throw new Error("Styling Service error (" + res.status + ")");
  return res.json();
}

function priceTotalOf(items) {
  return items.reduce(function (sum, it) { return sum + it.price_amount; }, 0);

function currencyOf(items) {
  return (items[0] && items[0].price_currency) || "EUR";
}

      setSaved(true);
    } catch (err) {
      setSaveError(err.message);
    } finally {
      setSaving(false);
    }
  };

  return html`
    <div style=${{ flex: 1, display: "flex", flexDirection: "column" }}>
      <${TopBar} onBack=${props.onBack} />
      <div style=${{ padding: "0 20px", flex: 1, overflowY: "auto" }}>
        <div style=${{ borderRadius: 20, overflow: "hidden", height: 420 }}>
          <${TryOnPreview} photo=${props.photo} items=${outfit.items} lowConfidence=${props.lowConfidence} />
        </div>
        <span style=${{ fontFamily: "IBM Plex Mono, monospace", fontSize: 10, color: "#B5A99C", letterSpacing: 1, display: "block", marginTop: 16 }}>
          ${outfit.number} — ${outfitLabel(t, outfit.label).toUpperCase()}
        </span>
        <div style=${{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 4 }}>
          <h2 style=${{ fontFamily: "Fraunces, serif", fontSize: 24, margin: "4px 0", color: "#F3ECE2" }}>${t("outfit_word", { label: outfitLabel(t, outfit.label) })}</h2>
          <button
            onClick=${handleSave}
            disabled=${saving || saved}
            style=${{ fontFamily: "Inter, sans-serif", fontSize: 12, fontWeight: 600, padding: "8px 12px", borderRadius: 10, border: "1px solid #C9A05C", background: saved ? "#C9A05C" : "transparent", color: saved ? "#15110F" : "#C9A05C", cursor: saving || saved ? "default" : "pointer", whiteSpace: "nowrap" }}
          >
            ${saved ? t("saved") : saving ? t("saving") : t("save")}
          </button>
        </div>
        <${ErrorNote} message=${saveError} />
        ${outfit.why ? html`
          <p style=${{ fontFamily: "Inter, sans-serif", fontSize: 13.5, color: "#B5A99C", lineHeight: 1.5, marginTop: 4, marginBottom: 20 }}>
            ${outfit.why}
          </p>
        ` : null}
        <div style=${{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 20 }}>
          ${outfit.items.map(function (it) {
            return html`
              <div key=${it.id} style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 14px", borderRadius: 12, background: "#211C19", gap: 10 }}>
                <div onClick=${props.onSwapItem ? function () { props.onSwapItem(it); } : null} style=${{ minWidth: 0, cursor: props.onSwapItem ? "pointer" : "default" }}>
                  <div style=${{ fontFamily: "Inter, sans-serif", fontSize: 13.5, fontWeight: 500, color: "#F3ECE2" }}>
                    ${it.name} ${props.onSwapItem ? html`<span style=${{ fontSize: 11, color: "#B5A99C", textDecoration: "underline", marginLeft: 6 }}>${t("swap")}</span>` : null}
                  </div>
                  <div style=${{ fontFamily: "Inter, sans-serif", fontSize: 11.5, color: "#B5A99C", marginTop: 2 }}>${catName(t, it.category)} · ${it.retailer_id}</div>
                  <div style=${{ fontFamily: "Inter, sans-serif", fontSize: 11.5, color: "#B5A99C", marginTop: 4 }}>${it.price_amount} ${it.price_currency}</div>
                </div>
                <a
                  href=${it.affiliate_url}
                  target="_blank"
                  rel="noopener noreferrer"
                  style=${{ flexShrink: 0, fontFamily: "Inter, sans-serif", fontSize: 11.5, fontWeight: 600, color: "#15110F", background: "#C9A05C", padding: "8px 12px", borderRadius: 2, textDecoration: "none", whiteSpace: "nowrap" }}
                >${t("buy_at", { r: it.retailer_id })} ↗</a>
              </div>
            `;
          })}
        </div>
        ${props.onAddCategory && props.missingCategories.length > 0 ? html`
          <div style=${{ marginBottom: 20 }}>
            <div style=${{ fontFamily: "IBM Plex Mono, monospace", fontSize: 11, letterSpacing: 1.2, color: "#8A7F72", marginBottom: 10, textTransform: "uppercase" }}>
              ${t("complete")}
            </div>
            <div style=${{ display: "flex", flexDirection: "column", gap: 8 }}>
              ${props.missingCategories.map(function (cat) {
                return html`<${SecondaryButton} key=${cat} onClick=${function () { props.onAddCategory(cat); }}>${t("add_cat", { cat: catName(t, cat) })}<//>`;
              })}
            </div>
          </div>
        ` : null}
      </div>
    </div>
  `;
}

function FitConnected() {
  const [screen, setScreen] = useState("welcome");
  const [lang, setLangState] = useState(detectLang());
  const t = makeT(lang);
  const setLang = function (l) {
    setLangState(l);
    storeSet("fit_lang", l);
  };
  const [photo, setPhoto] = useState(null);
  const [photoSaved, setPhotoSaved] = useState(false);
  const [savedAnalysis, setSavedAnalysis] = useState(null);
  const [height, setHeight] = useState("");
  const [analyzing, setAnalyzing] = useState(false);
  const [analyzeError, setAnalyzeError] = useState(null);
  const [bodyTypeResult, setBodyTypeResult] = useState(null);

  const [occasion, setOccasion] = useState("Work");
  const [season, setSeason] = useState("Fall");
  const [budget, setBudget] = useState(250);

  const [catalogLoading, setCatalogLoading] = useState(false);
  const [catalogError, setCatalogError] = useState(null);
  const [outfits, setOutfits] = useState([]);
  const [selectedOutfit, setSelectedOutfit] = useState(null);

  const [favorites, setFavorites] = useState([]);
  const [favoritesLoading, setFavoritesLoading] = useState(false);
  const [favoritesError, setFavoritesError] = useState(null);
  const [viewingFavorite, setViewingFavorite] = useState(null);

  // "build your own" / swap state
  const [customItems, setCustomItems] = useState([]); // items picked so far
  const [browseCategory, setBrowseCategory] = useState(null); // category currently being browsed
  const [browseStep, setBrowseStep] = useState(0);
  const [swapTarget, setSwapTarget] = useState(null); // { category, previousScreen }
  const BUILD_ORDER = ["top", "bottom", "shoes"];
  const [buildOwnPending, setBuildOwnPending] = useState(false);

  const fileRef = useRef(null);

  // Load the saved photo (and last body analysis) from this device, if any.
  useEffect(function () {
    const url = storeGet(PHOTO_KEY);
    if (!url) return;
    try {
      setPhoto(dataUrlToBlob(url));
      setPhotoSaved(true);
      const h = storeGet(HEIGHT_KEY);
      if (h) setHeight(h);
      const a = storeGet(ANALYSIS_KEY);
      if (a) setSavedAnalysis(JSON.parse(a));
    } catch (e) {
      storeRemove(PHOTO_KEY);
      storeRemove(ANALYSIS_KEY);
    }
  }, []);

  const handlePickPhoto = async function (file) {
    const small = await resizePhoto(file, 1280);
    setPhoto(small);
    setAnalyzeError(null);
    setSavedAnalysis(null);
    storeRemove(ANALYSIS_KEY);
    let ok = false;
    try {
      ok = storeSet(PHOTO_KEY, await blobToDataUrl(small));
    } catch (e) {}
    setPhotoSaved(ok);
  };

  const handleDeletePhoto = function () {
    storeRemove(PHOTO_KEY);
    storeRemove(ANALYSIS_KEY);
    storeRemove(HEIGHT_KEY);
    setPhoto(null);
    setPhotoSaved(false);
    setSavedAnalysis(null);
    setBodyTypeResult(null);
  };

  const loadFavorites = async function () {
    setFavoritesLoading(true);
    setFavoritesError(null);
    try {
      const data = await fetchFavorites();
      setFavorites(data.favorites || []);
    } catch (err) {
      setFavoritesError(err.message + " — " + t("waking"));
    } finally {
      setFavoritesLoading(false);
    }
  };

  const handleDeleteFavorite = async function (id) {
    try {
      await deleteFavoriteById(id);
      setFavorites(favorites.filter(function (f) { return f.id !== id; }));
    } catch (err) {
      setFavoritesError(err.message);
    }
  };

  const analyzePhoto = async function () {
    if (buildOwnPending) {
      setBuildOwnPending(false);
      setCustomItems([]);
      setBrowseStep(0);
      setBrowseCategory(BUILD_ORDER[0]);
      setScreen("build-browse");
      return;
    }
    if (photoSaved && savedAnalysis && String(savedAnalysis.height) === String(height) && savedAnalysis.result) {
      setBodyTypeResult(savedAnalysis.result);
      setScreen("profile");
      return;
    }
    setAnalyzing(true);
    setAnalyzeError(null);
    try {
      const result = await callFitService(photo, Number(height));
      if (!result.detected) {
        setAnalyzeError(result.message || "Could not detect a body in that photo.");
        return;
      }
      setBodyTypeResult(result);
      if (photoSaved) {
        storeSet(HEIGHT_KEY, String(height));
        const entry = { height: String(height), result: result };
        storeSet(ANALYSIS_KEY, JSON.stringify(entry));
        setSavedAnalysis(entry);
      }
      setScreen("profile");
    } catch (err) {
      setAnalyzeError(err.message + " — " + t("waking"));
    } finally {
      setAnalyzing(false);
    }
  };

  const generateOutfits = async function () {
    setCatalogLoading(true);
    setCatalogError(null);
    setScreen("generating");
    try {
      const data = await fetchStyledOutfits(bodyTypeResult.body_type, occasion, season, Number(budget));
      setOutfits(data.outfits || []);
      setScreen("results");
    } catch (err) {
      setCatalogError(err.message + " — " + t("waking"));
      setScreen("results");
    } finally {
      setCatalogLoading(false);
    }
  };

  // --- Build your own ---
  const startBuildOwn = function () {
    if (!photo) {
      setBuildOwnPending(true);
      setScreen("upload");
      return;
    }
    setCustomItems([]);
    setBrowseStep(0);
    setBrowseCategory(BUILD_ORDER[0]);
    setScreen("build-browse");
  };

  const handleBuildPick = function (product) {
    const next = customItems.filter(function (it) { return it.category !== product.category; }).concat([product]);
    setCustomItems(next);
    advanceBuild(next);
  };

  const handleBuildSkip = function () {
    advanceBuild(customItems);
  };

  const advanceBuild = function (items) {
    const nextStep = browseStep + 1;
    if (nextStep < BUILD_ORDER.length) {
      setBrowseStep(nextStep);
      setBrowseCategory(BUILD_ORDER[nextStep]);
    } else {
      const outfit = {
        label: "Custom",
        number: "—",
        items: items,
        priceTotal: priceTotalOf(items),
        currency: currencyOf(items),
        why: null,
      };
      setSelectedOutfit(outfit);
      setScreen("detail");
    }
  };

  // --- Swap a single piece inside whichever outfit is on screen ---
  const startSwap = function (item) {
    setSwapTarget({ category: item.category, forFavorite: screen === "favorite-detail" });
    setBrowseCategory(item.category);
    setScreen("swap-browse");
  };

  const handleSwapPick = function (product) {
    const base = swapTarget.forFavorite ? viewingFavorite : selectedOutfit;
    const newItems = base.items.filter(function (it) { return it.category !== product.category; }).concat([product]);
    const updated = Object.assign({}, base, { items: newItems, priceTotal: priceTotalOf(newItems), currency: currencyOf(newItems) });
    if (swapTarget.forFavorite) { setViewingFavorite(updated); } else { setSelectedOutfit(updated); }
    setSwapTarget(null);
    setScreen(swapTarget.forFavorite ? "favorite-detail" : "detail");
  };

  const addCategoryToOutfit = function (category) {
    setSwapTarget({ category: category, forFavorite: screen === "favorite-detail" });
    setBrowseCategory(category);
    setScreen("swap-browse");
  };

  const missingCategoriesFor = function (outfit) {
    if (!outfit) return [];
    const has = new Set(outfit.items.map(function (it) { return it.category; }));
    if (has.has("dress")) return has.has("shoes") ? [] : ["shoes"];
    return BUILD_ORDER.filter(function (c) { return !has.has(c); });
  };

  let screenEl = null;
  if (screen === "welcome") {
    screenEl = html`<${Welcome} lang=${lang} setLang=${setLang} onStart=${function () { setScreen("upload"); }} onBuildOwn=${startBuildOwn} onViewFavorites=${function () { setScreen("favorites"); loadFavorites(); }} />`;
  } else if (screen === "upload") {
    screenEl = html`<${UploadScreen}
      photo=${photo} onPickPhoto=${handlePickPhoto} photoSaved=${photoSaved} onDeletePhoto=${handleDeletePhoto} height=${height} setHeight=${setHeight}
      onBack=${function () { setScreen("welcome"); }} onNext=${analyzePhoto}
      analyzing=${analyzing} analyzeError=${analyzeError} fileRef=${fileRef}
    />`;
  } else if (screen === "profile") {
    screenEl = html`<${ProfileScreen}
      occasion=${occasion} setOccasion=${setOccasion} season=${season} setSeason=${setSeason}
      budget=${budget} setBudget=${setBudget}
      bodyType=${bodyTypeResult} onBack=${function () { setScreen("upload"); }} onNext=${generateOutfits}
      loading=${catalogLoading} loadError=${catalogError}
    />`;
  } else if (screen === "generating") {
    screenEl = html`<${Generating} />`;
  } else if (screen === "results") {
    screenEl = html`<${ResultsScreen}
      outfits=${outfits} error=${catalogError} onBack=${function () { setScreen("profile"); }}
      photo=${photo} lowConfidence=${bodyTypeResult && bodyTypeResult.mode === "fallback_overlay"}
      onSelect=${function (o) { setSelectedOutfit(o); setScreen("detail"); }}
      onBuildOwn=${startBuildOwn}
    />`;
  } else if (screen === "build-browse") {
    screenEl = html`<${CategoryBrowseScreen}
      category=${browseCategory}
      title=${t("pick_cat", { cat: catName(t, browseCategory) })}
      step=${browseStep + 1} totalSteps=${BUILD_ORDER.length}
      onBack=${function () { setScreen(photo ? "results" : "welcome"); }}
      onSelect=${handleBuildPick}
      onSkip=${handleBuildSkip}
    />`;
  } else if (screen === "swap-browse" && swapTarget) {
    screenEl = html`<${CategoryBrowseScreen}
      category=${swapTarget.category}
      title=${t("pick_cat", { cat: catName(t, swapTarget.category) })}
      onBack=${function () { setScreen(swapTarget.forFavorite ? "favorite-detail" : "detail"); setSwapTarget(null); }}
      onSelect=${handleSwapPick}
    />`;
  } else if (screen === "detail" && selectedOutfit) {
    screenEl = html`<${DetailScreen}
      outfit=${selectedOutfit} photo=${photo} lowConfidence=${bodyTypeResult && bodyTypeResult.mode === "fallback_overlay"}
      onBack=${function () { setScreen(outfits.length ? "results" : "welcome"); }}
      onSwapItem=${startSwap}
      onAddCategory=${addCategoryToOutfit}
      missingCategories=${missingCategoriesFor(selectedOutfit)}
    />`;
  } else if (screen === "favorites") {
    screenEl = html`<${FavoritesScreen}
      favorites=${favorites} loading=${favoritesLoading} error=${favoritesError}
      onBack=${function () { setScreen("welcome"); }}
      onDelete=${handleDeleteFavorite}
      onSelect=${function (f) {
        setViewingFavorite({
          label: f.outfit_label,
          number: "—",
          items: f.items,
          priceTotal: f.price_total,
          currency: (f.items[0] && f.items[0].price_currency) || "EUR",
          why: null,
        });
        setScreen("favorite-detail");
      }}
    />`;
  } else if (screen === "favorite-detail" && viewingFavorite) {
    screenEl = html`<${DetailScreen}
      outfit=${viewingFavorite} photo=${null} lowConfidence=${false} alreadySaved=${true}
      onBack=${function () { setScreen("favorites"); }}
      onSwapItem=${startSwap}
      onAddCategory=${addCategoryToOutfit}
      missingCategories=${missingCategoriesFor(viewingFavorite)}
    />`;
  }

  return html`
    <${LangContext.Provider} value=${lang}>
    <div style=${{ display: "flex", justifyContent: "center", alignItems: "center", minHeight: "100vh" }}>
      <div style=${{ width: 390, height: 780, background: "#15110F", borderRadius: 40, border: "10px solid #0A0807", overflow: "hidden", position: "relative", boxShadow: "0 30px 60px rgba(0,0,0,0.5)" }}>
        <div style=${{ height: "100%", overflowY: "auto", display: "flex", flexDirection: "column" }}>
          ${screenEl}
        </div>
      </div>
    </div>
    <//>
  `;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(html`<${FitConnected} />`);
</script>
</body>
</html>
